name: neovim
adopt-info: neovim
summary: Single-line elevator pitch for your amazing SDK
description: |
  This SDK provides a base neovim install.
license: MIT
platforms:
  ubuntu@22.04:amd64:
  ubuntu@22.04:arm64:
  ubuntu@24.04:amd64:
  ubuntu@24.04:arm64:
  ubuntu@26.04:amd64:
  ubuntu@26.04:arm64:

parts:
  neovim:
    plugin: nil
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"

      case "$CRAFT_ARCH_BUILD_FOR" in
        "amd64")
          ARCH=x86_64
          ;;
        "arm64")
          ARM=arm64
          ;;
        *)
          echo "unsupported architecture: $CRAFT_ARCH_BUILD_FOR"
          exit 1;
      esac

      curl -fLO "https://github.com/neovim/neovim/releases/download/v${VERSION}/nvim-linux-${ARCH}.tar.gz"

      mkdir -p "$CRAFT_PART_INSTALL"
      tar -xzf "nvim-linux-${ARCH}.tar.gz" --strip-components=1 -C "$CRAFT_PART_INSTALL"
