name: neovim
adopt-info: neovim
summary: The neovim text editor
description: |
  This SDK provides the Neovim editor and Lua runtime for building and testing
  Neovim plugins. Neovim caches are persisted on the host to speed up plugin
  installs across workshop updates. It can also be used as the editing
  environment inside the workshop.
license: Apache 2.0
build-base: ubuntu@26.04
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [amd64]
    build-for: [arm64]

plugs:
  nvim-cache:
    interface: mount
    workshop-target: /home/workshop/.cache/nvim

parts:
  neovim:
    plugin: nil
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"

      case "$CRAFT_ARCH_BUILD_FOR" in
        "amd64")
          ARCH=x86_64
          ;;
        "arm64")
          ARM=arm64
          ;;
        *)
          echo "unsupported architecture: $CRAFT_ARCH_BUILD_FOR"
          exit 1;
      esac

      curl -fLO "https://github.com/neovim/neovim/releases/download/v${VERSION}/nvim-linux-${ARCH}.tar.gz"

      mkdir -p "$CRAFT_PART_INSTALL"
      tar -xzf "nvim-linux-${ARCH}.tar.gz" --strip-components=1 -C "$CRAFT_PART_INSTALL"
