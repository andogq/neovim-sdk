name: Build SDK

on:
  pull_request:
    branches:
      # Run on main until versioned branches are created
      - main
      - \"[0-9]+.[0-9]+\"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: canonical/sdkcraft-actions/.github/workflows/build.yml@main
